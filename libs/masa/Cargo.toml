[package]
name = "masa"
version = "0.1.0"
edition = "2021"

[dependencies]
masa-core = { path = "../masa-core" }
tokio = { path = "../tokio/tokio", optional = true }
tonic = { path = "../tonic/tonic" }


[features]
sched_slo = ["masa-core/sched_slo", "tokio/sched_prio", "tonic/sched_slo"]
sched_tailclipper = ["masa-core/sched_tailclipper", "tokio/sched_prio", "tokio/tailclipper", "tonic/sched_tailclipper"]
sched_fifo  = ["masa-core/sched_fifo",  "tokio/sched_fifo",  "tonic/sched_fifo"]
sched_pred = ["masa-core/sched_pred", "tonic/sched_pred", "sched_slo"]

slo_abort = ["masa-core/slo_abort", "tonic/slo_abort"]
est = ["masa-core/est", "tonic/est"]

est_rms = ["tonic/est_rms"]
est_hist = ["tonic/est_hist"]
est_mean_var = ["tonic/est_mean_var"]

ac_est = ["masa-core/ac_est", "tonic/ac_est"]
ac_rajomon = ["masa-core/ac_rajomon", "tonic/ac_rajomon"]
trace-queue = ["tonic/trace-queue"]
