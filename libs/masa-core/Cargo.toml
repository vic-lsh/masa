[package]
name = "masa-core"
version = "0.1.0"
edition = "2021"

[features]
sched_fifo = []
sched_slo = []
sched_tailclipper = []
sched_oracle = []
sched_pred = ["estimator", "sched_slo"]
abort_slo = []
abort_slack = ["estimator"]
signal_slack = ["estimator"]
estimator = []
est_mean_var = []
est_rms = []
est_hist = []
ac_pred = ["estimator"]
ac_rajomon = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"
log = "0.4"
http = "0.2"
tower-service = { path = "../tower/tower-service" }
