[package]
name = "tonic"
# When releasing to crates.io:
# - Remove path dependencies
# - Update html_root_url.
# - Update doc url
#   - Cargo.toml
#   - README.md
# - Update CHANGELOG.md.
# - Create "v0.11.x" git tag.
authors = ["Lucio Franco <luciofranco14@gmail.com>"]
categories = ["web-programming", "network-programming", "asynchronous"]
description = """
A gRPC over HTTP/2 implementation focused on high performance, interoperability, and flexibility.
"""
documentation = "https://docs.rs/tonic/0.11.0"
edition = "2021"
homepage = "https://github.com/hyperium/tonic"
keywords = ["rpc", "grpc", "async", "futures", "protobuf"]
license = "MIT"
readme = "../README.md"
repository = "https://github.com/hyperium/tonic"
version = "0.11.0"

[features]
codegen = ["dep:async-trait"]
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]
default = ["transport", "codegen", "prost"]
prost = ["dep:prost"]
tls = [
  "dep:rustls-pki-types",
  "dep:rustls-pemfile",
  "transport",
  "dep:tokio-rustls",
  "dep:tokio",
  "tokio?/rt",
  "tokio?/macros",
]
tls-roots = ["tls-roots-common", "dep:rustls-native-certs"]
tls-roots-common = ["tls"]
tls-webpki-roots = ["tls-roots-common", "dep:webpki-roots"]
transport = [
  "dep:async-stream",
  "dep:axum",
  "channel",
  "dep:h2",
  "dep:hyper",
  "dep:tokio",
  "tokio?/net",
  "tokio?/time",
  "dep:tower",
  "dep:hyper-timeout",
]
channel = []

# masa-specific features
masa = []
prio_global = ["masa/prio_global", "tokio/prio_global"]
prio_oldest = ["masa/prio_oldest", "tokio/prio_oldest"]
prio_local = ["masa/prio_local", "tokio/prio_local"]
fifo = ["masa/fifo", "tokio/fifo"]
fifo_span_tracing = ["masa"]
fifo_queue_tracing = ["masa"]
prio_global_queue_tracing = ["masa"]
early = ["masa"]


# [[bench]]
# name = "bench_main"
# harness = false

[dependencies]
log = "0.4"
base64 = "0.21"
bytes = "1.0"
http = "0.2"
tracing = "0.1"
rand = "0.8"
rand_distr = "0.4"
once_cell = "1.20"

http-body = "0.4.4"
percent-encoding = "2.1"
pin-project = "1.0.11"
tower-layer = { path = "../../../libs/tower/tower-layer/" }
tower-service = { path = "../../../libs/tower/tower-service" }

# Needed for our code-gen modification
masa = { path = "../../masa" }

# prost
prost = { version = "0.12", default-features = false, features = [
  "std",
], optional = true }

# codegen
async-trait = { version = "0.1.13", optional = true }

# transport
h2 = { version = "0.3.27", optional = true }
hyper = { path = "../../hyper", features = ["full"], optional = true }
hyper-timeout = { version = "0.4.1", optional = true }
tokio = { path = "../../tokio/tokio", optional = true }
tokio-stream = { path = "../../tokio/tokio-stream" }
tower = { path = "../../../libs/tower/tower", default-features = false, features = [
  "balance",
  "buffer",
  "discover",
  "limit",
  "load",
  "make",
  "timeout",
  "util",
], optional = true }
axum = { version = "0.6.20", default-features = false, optional = true }

# rustls
async-stream = { version = "0.3", optional = true }
rustls-pki-types = { version = "1.0", optional = true }
rustls-pemfile = { version = "2.0", optional = true }
rustls-native-certs = { version = "0.7", optional = true }
tokio-rustls = { version = "0.26.0", optional = true }
webpki-roots = { version = "0.26", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# compression
flate2 = { version = "1.0", optional = true }
zstd = { version = "0.12.3", optional = true }

[dev-dependencies]
bencher = "0.1.5"
quickcheck = "1.0"
quickcheck_macros = "1.0"
rand = "0.8"
static_assertions = "1.0"
tokio = { path = "../../tokio/tokio", features = ["rt", "macros"] }
tower = { path = "../../../libs/tower/tower", features = ["full"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
harness = false
name = "decode"
