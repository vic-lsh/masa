[package]
authors = ["Lucio Franco <luciofranco14@gmail.com>"]
edition = "2021"
license = "MIT"
name = "compression"
publish = false
version = "0.1.0"

[dependencies]
bytes = "1"
http = "0.2"
http-body = "0.4"
hyper = { path = "../../../hyper" }
paste = "1.0.12"
pin-project = "1.0"
prost = "0.12"
tokio = {path = "../../../tokio/tokio", features = ["macros", "rt-multi-thread", "net"]}
tokio-stream = { path = "../../../tokio/tokio-stream" }
tonic = {path = "../../tonic", features = ["gzip", "zstd"]}
masa-core = { path = "../../../masa-core" }
tower = {path = "../../../../libs/tower/tower", features = []}
tower-http = { version = "0.4", features = ["map-response-body", "map-request-body"]}

[build-dependencies]
tonic-build = {path = "../../tonic-build" }
