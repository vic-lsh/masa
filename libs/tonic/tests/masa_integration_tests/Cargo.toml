[package]
edition = "2021"
license = "MIT"
name = "masa-integration-tests"
publish = false
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
prost = "0.12"
hyper = { path = "../../../hyper" }
tokio = { path = "../../../tokio/tokio", features = ["macros"] }
tonic = { path = "../../tonic" }
masa-core = { path = "../../../masa-core" }
http = { version = "0.2" }

[build-dependencies]
prost-build = "0.12"
tonic-build = { path = "../../tonic-build" }

[features]
default = []
sched_prio = ["tonic/sched_prio", "masa-core/sched_prio"]
slo_abort = ["tonic/slo_abort", "masa-core/slo_abort"]
ac_rajomon = ["tonic/ac_rajomon", "masa-core/ac_rajomon"]
trace-queue = ["tonic/trace-queue"]
