[package]
edition = "2021"
license = "MIT"
name = "masa-integration-tests"
publish = false
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
prost = "0.12"
hyper = { path = "../../../hyper" }
tokio = { path = "../../../tokio/tokio", features = ["macros"] }
tonic = { path = "../../tonic" }
masa-core = { path = "../../../masa-core" }
masa-policy = { path = "../../../masa-policy" }
http = { version = "0.2" }

[build-dependencies]
prost-build = "0.12"
tonic-build = { path = "../../tonic-build" }

[features]
default = []
sched_slo = ["tonic/sched_slo", "masa-core/sched_slo", "masa-policy/sched_slo"]
abort_slo = ["tonic/abort_slo", "masa-core/abort_slo", "masa-policy/abort_slo"]
abort_slack = ["tonic/abort_slack", "masa-core/abort_slack", "masa-policy/abort_slack"]
signal_slack = ["tonic/signal_slack", "masa-core/signal_slack", "masa-policy/signal_slack"]
ac_rajomon = ["tonic/ac_rajomon", "masa-core/ac_rajomon", "masa-policy/ac_rajomon"]
trace_queue_latency = ["tonic/trace_queue_latency", "masa-policy/trace_queue_latency"]
