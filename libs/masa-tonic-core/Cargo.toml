[package]
name = "masa-tonic-core"
version = "0.1.0"
edition = "2021"
description = "Masa hook traits and runtime support for tonic integration."

[features]
default = []
runtime = ["dep:tokio"]

[dependencies]
tonic-core = { path = "../tonic/tonic-core" }
tokio = { path = "../tokio/tokio", features = ["rt"], optional = true }
