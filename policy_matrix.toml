[flags]
known = [
  "sched_fifo",
  "sched_slo",
  "sched_tailclipper",
  "sched_oracle",
  "sched_pred",
  "eval_oracle_continuation",
  "eval_estimator_audit",
  "abort_slo",
  "abort_slack",
  "signal_slack",
  "estimator",
  "est_mean_var",
  "est_hist",
  "est_rms",
  "ac_pred",
  "ac_rajomon",
  "trace_queue_latency",
  "deadline_equals_slack",
]

[implies]
sched_pred = ["estimator", "sched_slo"]
eval_oracle_continuation = ["sched_pred"]
eval_estimator_audit = ["sched_pred"]
abort_slack = ["estimator"]
signal_slack = ["estimator", "ac_pred"]
ac_pred = ["estimator"]
deadline_equals_slack = ["sched_pred"]

[mutually_exclusive]
scheduling = ["sched_fifo", "sched_slo", "sched_tailclipper", "sched_oracle"]
admission_control = ["ac_pred", "ac_rajomon"]
abort = ["abort_slo", "abort_slack"]
slack_action = ["abort_slack", "signal_slack"]
estimator_kind = ["est_mean_var", "est_hist", "est_rms"]

[matrices]
check = [
  "sched_fifo",
  "sched_fifo,abort_slo",
  "sched_slo",
  "sched_slo,abort_slo",
  "sched_tailclipper,abort_slo",
  "sched_oracle",
  "sched_slo,trace_queue_latency",
  "sched_slo,ac_rajomon",
  "sched_slo,ac_pred,est_mean_var",
  "sched_pred,abort_slo,ac_pred,est_mean_var",
  "sched_pred,abort_slack,est_mean_var",
  "sched_pred,signal_slack,ac_pred,est_mean_var",
  "sched_pred,abort_slack,ac_pred,est_mean_var,deadline_equals_slack",
]
test = [
  "sched_slo,trace_queue_latency",
  "sched_slo,abort_slo",
  "sched_slo,ac_rajomon",
  "sched_pred,abort_slo,ac_pred,est_mean_var",
]

[app_crates]
paths = [
  "apps/hotel/Cargo.toml",
  "apps/socialnet/Cargo.toml",
  "apps/synthbench/Cargo.toml",
  "apps/tracebench/generic-service/Cargo.toml",
]

[app_crates.features]
sched_slo = ["masa/sched_slo"]
sched_tailclipper = ["masa/sched_tailclipper"]
sched_fifo = ["masa/sched_fifo"]
sched_oracle = ["masa/sched_oracle"]
sched_pred = ["masa/sched_pred"]
abort_slo = ["masa/abort_slo"]
abort_slack = ["masa/abort_slack"]
signal_slack = ["masa/signal_slack"]
estimator = ["masa/estimator"]
ac_pred = ["masa/ac_pred"]
ac_rajomon = ["masa/ac_rajomon", "app-utils/ac_rajomon"]
est_rms = ["masa/est_rms"]
est_hist = ["masa/est_hist"]
est_mean_var = ["masa/est_mean_var"]
trace_queue_latency = ["masa/trace_queue_latency"]
deadline_equals_slack = ["masa/deadline_equals_slack"]

[python_policy.prio]
sched_fifo = "fifo"
sched_slo = "e2e_slo"
sched_tailclipper = "oldest"
sched_oracle = "oracle"
eval_oracle_continuation = "exact_continuation"
eval_estimator_audit = "slack"
sched_pred = "slack"

[python_policy]
prio_precedence = [
  "eval_oracle_continuation",
  "eval_estimator_audit",
  "sched_pred",
  "sched_tailclipper",
  "sched_oracle",
  "sched_slo",
  "sched_fifo",
]
ignored = ["estimator", "trace_queue_latency", "deadline_equals_slack"]

[python_policy.est]
est_mean_var = "mean_var"
est_hist = "hist"
est_rms = "rms"

[python_policy.drop]
abort_slack = "slack"
abort_slo = "e2e_slo"
signal_slack = "slack_signal"

[python_policy.ac]
ac_pred = "slack"
ac_rajomon = "rajomon"

