services:
  child:
    image: synthetic_child:${SYNTHETIC_IMAGE_TAG:-latest}
    scale: ${CHILD_REPLICAS}
    networks:
      - synthetic_network
    environment:
      - BINARY_NAME=synthetic_child
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${APP_CONFIG_PATH}:/usr/config.json:ro
    deploy:
      resources:
        limits:
          cpus: "${CPUS_PER_REPLICA}"

  synthetic-frontend:
    image: synthetic_frontend:${SYNTHETIC_IMAGE_TAG:-latest}
    restart: always
    networks:
      - synthetic_network
    depends_on:
      - child
    environment:
      - BINARY_NAME=synthetic_frontend
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DOCKER_COMPOSE_PROJECT_NAME=${DOCKER_COMPOSE_PROJECT_NAME:-}
    volumes:
      - ${APP_CONFIG_PATH}:/usr/config.json:ro
    deploy:
      resources:
        limits:
          cpus: "4"

networks:
  synthetic_network:
    driver: bridge
