name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Detect which paths changed so downstream workflows can skip when irrelevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - '.github/workflows/**'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
              - '.github/workflows/**'

  fmt-cargo:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/fmt-cargo.yml

  check-cargo:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/check-cargo.yml

  lint-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/lint-python.yml

  test-pytest:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/test-pytest.yml

  test-cargo:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/test-cargo.yml
