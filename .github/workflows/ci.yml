name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  # Detect which paths changed so downstream workflows can skip when irrelevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - '.github/workflows/**'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
              - '.github/workflows/**'

  format:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-07
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/format.sh --check

  cargo-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: cargo check (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            features: ""
            cache_key: default
          - label: sched_fifo
            features: "sched_fifo"
            cache_key: sched-fifo
          - label: sched_fifo_abort_slo
            features: "sched_fifo,abort_slo"
            cache_key: sched-fifo-abort-slo
          - label: sched_slo
            features: "sched_slo"
            cache_key: sched-slo
          - label: sched_slo_abort_slo
            features: "sched_slo,abort_slo"
            cache_key: sched-slo-abort-slo
          - label: sched_tailclipper_abort_slo
            features: "sched_tailclipper,abort_slo"
            cache_key: sched-tailclipper-abort-slo
          - label: sched_oracle
            features: "sched_oracle"
            cache_key: sched-oracle
          - label: sched_slo_trace_queue_latency
            features: "sched_slo,trace_queue_latency"
            cache_key: sched-slo-trace-queue-latency
          - label: sched_slo_ac_rajomon
            features: "sched_slo,ac_rajomon"
            cache_key: sched-slo-ac-rajomon
          - label: sched_slo_ac_pred_est_mean_var
            features: "sched_slo,ac_pred,est_mean_var"
            cache_key: sched-slo-ac-pred-est-mean-var
          - label: sched_pred_abort_slo_ac_pred_est_mean_var
            features: "sched_pred,abort_slo,ac_pred,est_mean_var"
            cache_key: sched-pred-abort-slo-ac-pred-est-mean-var
          - label: sched_pred_abort_slack_est_mean_var
            features: "sched_pred,abort_slack,est_mean_var"
            cache_key: sched-pred-abort-slack-est-mean-var
          - label: sched_pred_signal_slack_ac_pred_est_mean_var
            features: "sched_pred,signal_slack,ac_pred,est_mean_var"
            cache_key: sched-pred-signal-slack-ac-pred-est-mean-var
          - label: sched_mt
            features: "sched_mt"
            cache_key: sched-mt
          - label: sched_mt_abort_slo
            features: "sched_mt,abort_slo"
            cache_key: sched-mt-abort-slo
          - label: sched_mt_ac_rajomon
            features: "sched_mt,ac_rajomon"
            cache_key: sched-mt-ac-rajomon
          - label: sched_mt_multiqueue
            features: "sched_mt_multiqueue"
            cache_key: sched-mt-multiqueue
          - label: sched_mt_multiqueue_abort_slo
            features: "sched_mt_multiqueue,abort_slo"
            cache_key: sched-mt-multiqueue-abort-slo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-07
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          cache-on-failure: true
      - name: Install protoc
        run: |
          ulimit -n 8192 || true
          ./scripts/install_protoc.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$HOME/.local/bin/protoc" >> "$GITHUB_ENV"
      - run: rustc --version && cargo --version && protoc --version
      - run: ./scripts/check.sh "${{ matrix.features }}"

  cargo-check-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-07
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-tests
          cache-on-failure: true
      - name: Install protoc
        run: |
          ulimit -n 8192 || true
          ./scripts/install_protoc.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$HOME/.local/bin/protoc" >> "$GITHUB_ENV"
      - run: rustc --version && cargo --version && protoc --version
      - run: ./scripts/check.sh --tests

  lint-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/lint_python.sh

  pytest:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update -yqq && sudo apt-get install -y libgraphviz-dev pkg-config
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --dev
      - run: ./scripts/test_python.sh

  test-cargo:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: cargo test (${{ matrix.label }})
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            features: ""
            cache_key: default
          - label: sched_slo_trace_queue_latency
            features: "sched_slo,trace_queue_latency"
            cache_key: sched-slo-trace-queue-latency
          - label: sched_slo_abort_slo
            features: "sched_slo,abort_slo"
            cache_key: sched-slo-abort-slo
          - label: sched_slo_ac_rajomon
            features: "sched_slo,ac_rajomon"
            cache_key: sched-slo-ac-rajomon
          - label: sched_pred_abort_slo_ac_pred_est_mean_var
            features: "sched_pred,abort_slo,ac_pred,est_mean_var"
            cache_key: sched-pred-abort-slo-ac-pred-est-mean-var
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-07
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          cache-on-failure: true
      - name: Install protoc
        run: |
          ulimit -n 4096 || true
          ./scripts/install_protoc.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$HOME/.local/bin/protoc" >> "$GITHUB_ENV"
      - run: rustc --version && cargo --version && protoc --version
      - run: ./scripts/test.sh --feature "${{ matrix.features }}"

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs:
      - changes
      - format
      - cargo-check
      - cargo-check-tests
      - lint-python
      - pytest
      - test-cargo
    if: always()
    steps:
      - name: Check CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          CARGO_CHECK_RESULT: ${{ needs.cargo-check.result }}
          CARGO_CHECK_TESTS_RESULT: ${{ needs.cargo-check-tests.result }}
          LINT_PYTHON_RESULT: ${{ needs.lint-python.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          TEST_CARGO_RESULT: ${{ needs.test-cargo.result }}
        run: |
          failed=0
          for result in \
            "$CHANGES_RESULT" \
            "$FORMAT_RESULT" \
            "$CARGO_CHECK_RESULT" \
            "$CARGO_CHECK_TESTS_RESULT" \
            "$LINT_PYTHON_RESULT" \
            "$PYTEST_RESULT" \
            "$TEST_CARGO_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
