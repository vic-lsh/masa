cargo_check:
    stage: quick-checks
    variables:
        CI: "true"
    parallel:
        matrix:
            - FEATURES:
                  [
                      "",
                      "sched_fifo",
                      "sched_prio",
                      "sched_prio,tailclipper,slo_abort",
                      "sched_prio,ac_rajomon",
                      "sched_prio,est_abort,ac_est,est_mean_var",
                  ]
    script:
        - rustc --version && cargo --version # Print version info for debugging
        - ./scripts/check.sh "$FEATURES"

cargo_check_tests:
    stage: quick-checks
    variables:
        CI: "true"
    script:
        - rustc --version && cargo --version # Print version info for debugging
        - ./scripts/check.sh --tests ""
