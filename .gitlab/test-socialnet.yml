test_socialnet:
    stage: test
    services:
        - docker:dind
    variables:
        CI: "true"
        CARGO_BUILD_JOBS: "16"
        DOCKER_HOST: tcp://docker:2375
        DOCKER_TLS_CERTDIR: ""
    before_script:
        - ulimit -n 4096 || true
        - apt-get update -yqq
        - apt-get install -y protobuf-compiler docker.io
        - if ! command -v cargo &>/dev/null; then
          echo "Installing Rust...";
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y;
          source $HOME/.cargo/env;
          fi
        - rustup toolchain install nightly
        - rustc --version
        - cargo --version
    script:
        - groups $(whoami) # make sure that gitlab runner is in the 'docker' group
        - ./scripts/test_socialnet.sh
