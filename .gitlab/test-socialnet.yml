test_socialnet:
    stage: test
    variables:
        CI: "true"
        CARGO_BUILD_JOBS: "16"
    before_script:
        - ulimit -n 4096 || true
    tags:
        - on-host
    script:
        - groups $(whoami) # make sure that gitlab runner is in the 'docker' group
        - ./scripts/test_socialnet.sh
