test_socialnet:
    stage: test
    variables:
        CI: "true"
        CARGO_BUILD_JOBS: "16"
    before_script:
        - ulimit -n 4096 || true
        - if ! command -v cargo &>/dev/null; then
          echo "Installing Rust...";
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y;
          source $HOME/.cargo/env;
          fi
        - rustup toolchain install nightly
        - rustc --version
        - cargo --version
    tags:
        - on-host
    script:
        - groups $(whoami) # make sure that gitlab runner is in the 'docker' group
        - ./scripts/test_socialnet.sh
