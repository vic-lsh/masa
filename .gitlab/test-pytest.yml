
stages:
  - test

pytest:
  image: python:3.12-slim
  stage: test
  # Start immediately; don't wait for fmt/check/test stage ordering.
  needs: []
  # Still run even if other jobs fail (useful for seeing test signal).
  when: always
  before_script:
    - python --version
    - pip --version
    - pip install --upgrade pip
    - pip install pytest pytest-mock
  script:
    - pytest
