pytest:
  image: python:3.11
  stage: quick-checks
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv
  before_script:
    - |
      if ! command -v uv &> /dev/null; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      fi
    - uv sync --dev
    - source .venv/bin/activate
  script:
    - pytest
