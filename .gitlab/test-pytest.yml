pytest:
    image: python:3.11
    stage: quick-checks
    variables:
        CI: "true"
    cache:
        key:
            files:
                - uv.lock
        paths:
            - .venv
    before_script:
        - source ./scripts/ci_setup_env.sh
        - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
        - uv sync --dev
        - source .venv/bin/activate
    script:
        - ./scripts/test_python.sh
