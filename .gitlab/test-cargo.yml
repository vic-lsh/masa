cargo_test:
    stage: test
    parallel:
        matrix:
            - POLICY_FEATURE: ["", "sched_fifo", "sched_prio", "sched_prio,tailclipper,slo_abort", "sched_prio,ac_rajomon", "sched_prio,est_abort,est_mean_var"]
    variables:
        CI: "true"
        CARGO_BUILD_JOBS: "4"
    before_script:
        - ulimit -n 4096 || true
        - chmod +x ./scripts/install_protoc.sh
        - ./scripts/install_protoc.sh
        - export PATH="$HOME/.local/bin:$PATH"
        - export PROTOC="$HOME/.local/bin/protoc"
    script:
        - rustc --version && cargo --version # Print version info for debugging
        - ./scripts/test.sh --feature "$POLICY_FEATURE"
