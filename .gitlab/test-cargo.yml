cargo_test:
    stage: test
    parallel:
        matrix:
            - POLICY_FEATURE: ["", "fifo", "prio_global", "prio_oldest", "prio_local", "prio_local,est_rms", "prio_local,est_hist", "prio_global,early", "prio_global,trace-queue"]
    variables:
        CI: "true"
        CARGO_BUILD_JOBS: "4"
    before_script:
        - ulimit -n 4096 || true
        - chmod +x ./scripts/install_protoc.sh
        - ./scripts/install_protoc.sh
        - export PATH="$HOME/.local/bin:$PATH"
        - export PROTOC="$HOME/.local/bin/protoc"
    script:
        - rustc --version && cargo --version # Print version info for debugging
        - ./scripts/test.sh --parallel 8 --feature "$POLICY_FEATURE"
