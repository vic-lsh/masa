test_synthetic_experiment:
    stage: test
    services: []
    parallel:
        matrix:
            - DEPLOY_MODE: [docker, kind]
    variables:
        CI: "true"
        EXP_NAME: "ci"
        CARGO_BUILD_JOBS: "16"
        # Using Docker-on-Docker (socket binding) instead of DIND
        # DOCKER_HOST: tcp://docker:2375
        # DOCKER_TLS_CERTDIR: ""

    before_script:
        - ulimit -n 4096 || true
        - source ./scripts/ci_setup_env.sh
        - export RUSTUP_HOME="$HOME/.rustup"
        - export CARGO_HOME="$HOME/.cargo"
        - export PATH="$HOME/.local/bin:$CARGO_HOME/bin:$PATH"
        - |
            if [[ "$DEPLOY_MODE" == "kind" ]]; then
              if ! command -v kind &> /dev/null; then
                echo "Installing kind..."
                curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
                chmod +x ./kind
                mv ./kind $HOME/.local/bin/kind
              fi
              if ! command -v kubectl &> /dev/null; then
                echo "Installing kubectl..."
                curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl
                mv kubectl $HOME/.local/bin/kubectl
              fi
              if ! command -v helm &> /dev/null; then
                echo "Installing helm..."
                curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
                chmod 700 get_helm.sh
                HELM_INSTALL_DIR=$HOME/.local/bin ./get_helm.sh --no-sudo
                rm get_helm.sh
              fi
            fi
        - uv sync
        - source .venv/bin/activate
        - if ! command -v cargo &>/dev/null; then
          echo "Installing Rust...";
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y;
          source $HOME/.cargo/env;
          fi
        - rustup toolchain install nightly
        - rustc --version
        - cargo --version
    script:
        - groups $(whoami) # make sure that gitlab runner is in the 'docker' group
        - ./scripts/test_synthetic_experiment.sh $EXP_NAME --deploy-mode $DEPLOY_MODE
    after_script:
        - export PATH="$HOME/.local/bin:$PATH"
