test_synthetic_experiment:
  stage: test
  before_script:
    - |
      if ! command -v uv &> /dev/null; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.cargo/bin:$PATH"
      fi
    - uv sync
    - source .venv/bin/activate
  tags:
    - on-host
  script:
    - groups $(whoami) # make sure that gitlab runner is in the 'docker' group
    - ./scripts/test_synthetic_experiment.sh
