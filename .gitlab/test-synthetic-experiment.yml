test_synthetic_experiment:
  stage: test
  parallel:
    matrix:
      - EXP_NAME: [ci, ci_call_graph]
        DEPLOY_MODE: [docker, k8s]
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv
  before_script:
    - |
      if ! command -v uv &> /dev/null; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      fi
    - uv sync
    - source .venv/bin/activate
  tags:
    - on-host
  script:
    - groups $(whoami) # make sure that gitlab runner is in the 'docker' group
    - ./scripts/test_synthetic_experiment.sh $EXP_NAME --deploy-mode $DEPLOY_MODE
