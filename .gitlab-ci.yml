# Run on default branch as well as on merge requests
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Define stages
stages:
  - trigger

# Trigger the Rust fmt->check->test pipeline (parent waits on result).
rust_pipeline:
  stage: trigger
  trigger:
    include:
      - local: .gitlab/rust-pipeline.yml
    strategy: depend

# Trigger pytest as a separate (child) pipeline so it runs independently.
pytest_pipeline:
  stage: trigger
  when: always
  trigger:
    include:
      - local: .gitlab/test-pytest.yml
