# Default values for hotel.

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

logLevel: "info"

service:
  type: ClusterIP

# Default resource limits applied when a service/infra entry omits its own.
defaultServiceResources:
  limits:
    cpu: "4"
    memory: "4Gi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Hotel microservices. Each entry expands to `replicas` Deployments and
# `replicas` Services named `{fullname}-{name}-1`..`{fullname}-{name}-N`
# (matching docker-compose `{project}-{svc}-N`). The Rust
# `LoadBalancedChannel` then opens one gRPC connection per `-i` Service so
# load actually fans out across pods (kube-proxy IP-LB doesn't fan out
# per-RPC on a single HTTP/2 connection).
#
# `create_hotel_config_dict` writes the *base* hostname `{project}-{name}`
# into hotel.json for scaled services; the Rust client appends `-1..-N`.
# Non-scaled services (frontend) have replicas=1 and the `-1`-suffixed
# Service name baked directly into hotel.json. The `scaled` flag below is
# a hint to the runner — the chart treats every entry uniformly.
services: []
# - name: rate-service
#   binary: hotel_rate
#   replicas: 4
#   port: 8663
#   scaled: true

# Stateful infrastructure (mongo / redis). Each produces a single-replica
# Deployment and a `{fullname}-{name}-1` Service.
infra: []
# - name: rate-mongo
#   image: mongo:7.0
#   command: ["--port", "27003"]
#   port: 27003
#   volumeClaim: rate
# - name: rate-redis
#   image: redis:7.2
#   command: ["redis-server", "--port", "11003", "--io-threads", "4"]
#   port: 11003

# PersistentVolumeClaims for mongo data directories. Bound by name from
# infra[*].volumeClaim above.
pvcs: []
# - name: rate
#   storage: 100Mi

# Inline ConfigMap holding hotel.json and policy_params.json; mounted at
# /usr/config.json and /usr/policy_params.json in every service pod.
configMaps:
  enabled: false
  hotelJson: ""
  policyParamsJson: ""
