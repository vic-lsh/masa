# Default values for hotel.

image:
  repository: ""  # Empty because image names are constructed from service names
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

resources:
  default:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 128Mi
  frontend:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 512Mi
  infrastructure:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 256Mi

logLevel: "info"

# Services to deploy (generated by runner)
services: {}

# Infrastructure to deploy (generated by runner)
infrastructure: {}
