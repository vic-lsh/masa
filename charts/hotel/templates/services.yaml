{{/*
  Hotel microservices. Each `services[]` entry produces `replicas` Services
  named `{fullname}-{name}-1`..`{fullname}-{name}-N`, one per Deployment
  from deployments.yaml. The Rust `LoadBalancedChannel::new(base, port,
  replicas)` opens N independent gRPC channels to `{base}-1..{base}-N` —
  matching the docker-compose container naming `{project}-{svc}-N`. Each
  Service selects exactly one pod via the unique component label. Non-scaled
  services (e.g. hotel-frontend-service) have replicas=1 and produce a
  single `-1` Service, which `create_hotel_config_dict` references directly.
*/}}
{{- range $service := .Values.services }}
{{- $replicas := int ($service.replicas | default 1) }}
{{- range $i := until $replicas }}
{{- $idx := add $i 1 }}
{{- $component := printf "%s-%d" $service.name $idx }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hotel.fullname" $ }}-{{ $component }}
  labels:
    {{- include "hotel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "hotel.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}

{{/* Stateful infra Services — always single-replica, literal `-1` suffix. */}}
{{- range $svc := .Values.infra }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hotel.fullname" $ }}-{{ $svc.name }}-1
  labels:
    {{- include "hotel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
      name: tcp
  selector:
    {{- include "hotel.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
{{- end }}
