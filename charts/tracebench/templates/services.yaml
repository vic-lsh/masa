{{- range $service := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tracebench.fullname" $ }}-{{ $service.name }}-1
  labels:
    {{- include "tracebench.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "tracebench.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
{{- end }}
