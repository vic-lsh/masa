# Default values for mssim.

image:
  repository: ""
  genericServiceName: generic_service
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 50051

logLevel: "info"

# Name of the ConfigMap containing deployment.json
deploymentConfigMap: ""

# List of ConfigMaps containing callgraph data. 
# Each will be mounted at /app/callgraphs/{configMapName} (or handled by runner logic)
# Actually, let's make it a list of objects: { name: "config-map-name", mountPath: "graph-name" }
callgraphs: []

# List of services to deploy
services: []
# - name: "frontend-s1"
#   replicas: 1
#   env: {}

# Inline ConfigMaps generation
configMaps:
  enabled: false
  deploymentJson: ""
  callgraphs: []
  # - name: "graph1"
  #   filename: "S_1..."
  #   content: "{...}"
