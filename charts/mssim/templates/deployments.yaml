{{- range $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mssim.fullname" $ }}-{{ $service.name }}
  labels:
    {{- include "mssim.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: {{ $service.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "mssim.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "mssim.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
    spec:
      containers:
        - name: service
          image: "{{ $.Values.image.repository }}{{ $.Values.image.genericServiceName }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: LOG_LEVEL
              value: {{ $.Values.logLevel | quote }}
            {{- range $key, $val := $service.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $.Values.service.port }}
              name: grpc
          volumeMounts:
            - name: deployment-config
              mountPath: /app/config/deployment.json
              subPath: deployment.json
            {{- range $graph := $.Values.callgraphs }}
            - name: callgraph-{{ $graph.name }}
              mountPath: /app/callgraphs/{{ $graph.mountPath }}
            {{- end }}
      volumes:
        - name: deployment-config
          configMap:
            name: {{ $.Values.deploymentConfigMap }}
        {{- range $graph := $.Values.callgraphs }}
        - name: callgraph-{{ $graph.name }}
          configMap:
            name: {{ $graph.configMapName }}
        {{- end }}
{{- end }}
