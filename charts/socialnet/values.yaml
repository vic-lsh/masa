# Default values for socialnet.

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

resources:
  default:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 128Mi
  frontend:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 512Mi
  infrastructure:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 256Mi

logLevel: "info"

services: {}
infrastructure: {}
