{{/*
  Socialnet microservice Services. Each `services[]` entry produces `replicas`
  Services named `{fullname}-{name}-1`..`{fullname}-{name}-N`, one per
  Deployment from deployments.yaml. The Rust `LoadBalancedChannel::new(base,
  port, replicas)` opens N independent gRPC channels to `{base}-1..{base}-N`
  — matching the docker-compose container naming `{project}-{svc}-N`. Each
  Service selects exactly one pod via the unique component label.
*/}}
{{- range $service := .Values.services }}
{{- if not $service.noListen }}
{{- $replicas := int ($service.replicas | default 1) }}
{{- range $i := until $replicas }}
{{- $idx := add $i 1 }}
{{- $component := printf "%s-%d" $service.name $idx }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "socialnet.fullname" $ }}-{{ $component }}
  labels:
    {{- include "socialnet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "socialnet.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}

{{/*
  Stateful infra Services. Referenced directly by hostname (no `-1` suffix)
  in service env vars like `mongodb://{project}-post-storage-mongo:27017`.
*/}}
{{- range $svc := .Values.infra }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "socialnet.fullname" $ }}-{{ $svc.name }}
  labels:
    {{- include "socialnet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
      name: tcp
  selector:
    {{- include "socialnet.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
{{- end }}
