{{/* Socialnet microservices (per-binary images). */}}
{{- range $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "socialnet.fullname" $ }}-{{ $service.name }}
  labels:
    {{- include "socialnet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: {{ $service.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "socialnet.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "socialnet.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
    spec:
      containers:
        - name: service
          image: "{{ $.Values.image.repository }}{{ $service.binary }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: BINARY_NAME
              value: {{ $service.binary | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.logLevel | quote }}
            {{- with $service.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if not $service.noListen }}
          ports:
            - containerPort: {{ $service.port }}
              name: grpc
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          {{- end }}
          {{- with ($service.resources | default $.Values.defaultServiceResources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /usr/config.json
              subPath: config.json
            - name: config
              mountPath: /usr/policy_params.json
              subPath: policy_params.json
      volumes:
        - name: config
          configMap:
            name: {{ include "socialnet.fullname" $ }}-config
{{- end }}

{{/* Stateful infrastructure: mongo / redis / memcached / rabbitmq. */}}
{{- range $svc := .Values.infra }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "socialnet.fullname" $ }}-{{ $svc.name }}
  labels:
    {{- include "socialnet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "socialnet.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $svc.name }}
  template:
    metadata:
      labels:
        {{- include "socialnet.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $svc.name }}
    spec:
      containers:
        - name: {{ $svc.name }}
          image: {{ $svc.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $svc.pullPolicy }}
          {{- with $svc.command }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ $svc.port }}
              protocol: TCP
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
