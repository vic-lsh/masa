version: 1
id: fixed_capacity/trace_short_sequential_branching

description: >
  Compare Masa with Rajomon-FIFO and Rajomon-TailClipper on a short,
  sequential, trace-derived workload at fixed capacity.

hypothesis: >
  Updating slack at successive service boundaries preserves more goodput under
  overload than request-age or queue-delay signals.

workload:
  callgraphs:
    - trace-analysis/graph_branch/S_14677443
  characteristics:
    services: 8
    maximum_sequential_hops: 2
    maximum_fanout: 7
    depth: 2
  slo_ms: 100

load:
  arrival: poisson
  offered_rps: [500, 600, 800, 1000, 1300, 1800]

execution:
  warmup_secs: 15
  measurement_secs: 30
  repetitions: 1
  max_in_flight: 100000

policies:
  - policies/rajomon_fifo.yaml
  - policies/rajomon_tailclipper.yaml
  - policies/masa.yaml

# Tuned controller parameters are part of the experiment, not environmental
# defaults. Pinning them here makes changes to the executable inputs detectable.
parameters:
  rajomon:
    sched_fifo:
      latency_threshold_us: 22002
      price_update_rate_ms: 10
      price_step_up: 19
      init_price: 810
      price_freq: 3
      tokens_left_init: 14
      token_update_rate_ms: 1
      token_update_step: 295612
    sched_tailclipper:
      latency_threshold_us: 8558
      price_update_rate_ms: 10
      price_step_up: 4
      init_price: 758
      price_freq: 3
      tokens_left_init: 217
      token_update_rate_ms: 1
      token_update_step: 66049
  pred:
    tau_er: 2
    estimator_k: 0

analysis:
  primary_metric: goodput_rps
  comparisons:
    - masa_vs_rajomon_fifo
    - masa_vs_rajomon_tailclipper

# Temporary adapter to the current application-oriented runner layout. The
# validator compares the executable config against every field above so drift
# is detected before a run begins.
runner:
  app: tracebench
  experiment: s1467_acCmp
