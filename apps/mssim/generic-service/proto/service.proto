syntax = "proto3";
package service;

import "google/protobuf/timestamp.proto";

service Service {
  rpc GetData(ServiceRequest) returns (ServiceResponse);
  rpc Root(RootRequest) returns (RootResponse);
  rpc Replay(ReplayRequest) returns (ReplayResponse);
  rpc Ping(PingRequest) returns (PingResponse);
}
message PingRequest {}

message PingResponse {}

message RootRequest {
  uint64 req_id = 1;
  uint64 start_at = 2;
  string graph_name = 3;
}

message RootResponse {
  uint64 req_id = 1;
}

message ServiceRequest { 
  uint64 req_id = 1;
  uint64 start_at = 2;
  string method_name = 3;
  string graph_name = 4;
}

message ServiceResponse {
  repeated CallData calls = 1;
  string method_name = 2;
}

message CallData {
  string method_name = 1;
  google.protobuf.Timestamp request_sent_at = 2;
  google.protobuf.Timestamp response_received_at = 3;
  bool was_an_error = 4;
}

message LocalSpan {
  enum SpanType {
    UNKNOWN = 0;
    COMPUTE = 1;
    BLOCK = 2;
  }

  SpanType type = 1;
  uint64 val = 2;
}

message ChildSpans {
  string name = 1;
  repeated Span spans = 2;
}

message Span {
  oneof kind {
    LocalSpan local_span = 1;
    ChildSpans child_spans = 2;
  }
}

message ReplayRequest {
  uint64 req_id = 1;
  uint64 exclude_queue_latency = 2;
  uint64 slo = 3;
  uint64 start_at = 4;
  uint64 deadline = 5;
  repeated Span spans = 6;
}

enum ResponseStatus {
  OK = 0;
  ERROR = 1;
}

message ReplayResponse {
  uint64 req_id = 1;
  ResponseStatus status = 2;
}
