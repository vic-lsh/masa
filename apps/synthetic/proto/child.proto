syntax = "proto3";

package child;

service Child {
  rpc RandomLatency(RandomLatencyRequest) returns (RandomLatencyResponse) {}
  rpc ConstantLatency(ConstantLatencyRequest)
      returns (ConstantLatencyResponse) {}
}

message RandomLatencyRequest {}
message RandomLatencyResponse { uint64 handler_latency = 1; }

message ConstantLatencyRequest {}
message ConstantLatencyResponse { uint64 handler_latency = 1; }
