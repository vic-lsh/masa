syntax = "proto3";

package frontend;

service Frontend {
  rpc HandlePing(PingRequest) returns (PingResponse) {}
  rpc HandleA(ARequest) returns (AResponse) {}
  rpc HandleB(BRequest) returns (BResponse) {}
}

message PingRequest { string message = 1; }
message PingResponse { string message = 1; }

message ARequest {}
message AResponse {


  uint64 handler_latency = 7;
}


message BRequest {}
message BResponse {
}
