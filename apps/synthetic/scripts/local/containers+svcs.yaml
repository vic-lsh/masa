services:
  child-service:
    image: synthetic_child:latest
    scale: ${CHILD_REPLICAS}
    networks:
      - synthetic_network
    deploy:
      resources:
        limits:
          cpus: "4"

  frontend-service:
    image: synthetic_frontend:latest
    container_name: "synthetic_frontend"
    restart: always
    networks:
      - synthetic_network
    ports:
      - "${FRONTEND_PORT}:8000"
    depends_on:
      - child-service
    deploy:
      resources:
        limits:
          cpus: "4"

networks:
  synthetic_network:
    driver: bridge
