services:
  child-service:
    image: synthetic_child:${SYNTHETIC_IMAGE_TAG:-latest}
    scale: ${CHILD_REPLICAS}
    networks:
      - synthetic_network
    environment:
      - BINARY_NAME=synthetic_child
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "${CPUS_PER_REPLICA}"

  synthetic-frontend-service:
    image: synthetic_frontend:${SYNTHETIC_IMAGE_TAG:-latest}
    container_name: "synthetic_frontend"
    restart: always
    networks:
      - synthetic_network
    ports:
      - "${FRONTEND_PORT}:8000"
    depends_on:
      - child-service
    environment:
      - BINARY_NAME=synthetic_frontend
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"

networks:
  synthetic_network:
    driver: bridge
