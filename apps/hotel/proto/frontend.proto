syntax = "proto3";

package frontend;

service Frontend {
  rpc HandlePing(PingRequest) returns (PingResponse) {}
  rpc HandleSearch(SearchRequest) returns (SearchResponse) {}
  rpc HandleReservation(ReservationRequest) returns (ReservationResponse) {}
  rpc HandleReview(ReviewRequest) returns (ReviewResponse) {}
}

message PingRequest { string message = 1; }

message PingResponse { string message = 1; }

message SearchRequest {
  double lat = 1;
  double lon = 2;
  string inDate = 3;
  string outDate = 4;
  optional string locale = 5;
}

message SearchResponse { 
  repeated Hotel hotels = 1;
}

message Hotel {
  string name = 1;
  string id = 2;
  string phoneNumber = 3;
  float lat = 4;
  float lon = 5;
}

