//   string postcalCode = 6;
//   float lat = 7;
//   float lon = 8;
// }

// message Image { string url = 1; }

message ReservationRequest {
  string username = 1;
  string password = 2;
  string customer = 11;
  repeated string hotels = 12;
  string inDate = 13;
  string outDate = 14;
  uint32 numRooms = 15;
}

message ReservationResponse { repeated string hotels = 1; }

message ReviewRequest {
  string hotelId = 1;
}

message ReviewResponse {
  repeated ReviewComm reviews = 1;
}

message ReviewComm {
  string reviewId = 1;
  string hotelId = 2;
  string name = 3;
  float rating = 4;
  string description = 5;
  repeated Image images = 6;
}

message Image {
  string url = 1;
  bool default = 2;
}
