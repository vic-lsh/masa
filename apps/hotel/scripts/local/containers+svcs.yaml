        name: "${PROJECT_PREFIX:-}profile"
    reservation:
        name: "${PROJECT_PREFIX:-}reservation"
    user:
        name: "${PROJECT_PREFIX:-}user"

networks:
    hotel_network:
        name: "${PROJECT_PREFIX:-}hotel_network"
        driver: bridge
