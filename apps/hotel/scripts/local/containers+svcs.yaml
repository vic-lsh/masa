x-cpu-limit: &cpu-limit
  resources:
    limits:
      cpus: "${CPUS_PER_REPLICA:-4}"

x-service-environment: &service-environment
  - LOG_LEVEL=${LOG_LEVEL:-info}
  - CPUS_PER_REPLICA=${CPUS_PER_REPLICA:-4}

services:
  rate-mongo:
    image: mongo:7.0
    command: --port 27003
    restart: always
    networks:
      - hotel_network
    volumes:
      - rate:/data
    deploy: *cpu-limit

  rate-redis:
    image: redis:7.2
    command: ["redis-server", "--port", "11003", "--io-threads", "4"]
    restart: always
    networks:
      - hotel_network
    deploy: *cpu-limit

  rate-service:
    image: hotel_rate:${HOTEL_IMAGE_TAG:-latest}
    scale: ${RATE_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - rate-mongo
      - rate-redis
    environment: *service-environment
    volumes:
      - ${PROJECT_CONFIG_PATH}:/usr/config.json:ro
      - ${POLICY_PARAMS_PATH}:/usr/policy_params.json:ro
    deploy: *cpu-limit

  profile-mongo:
    image: mongo:7.0
    command: --port 27004
    restart: always
    networks:
      - hotel_network
    volumes:
      - profile:/data
    deploy: *cpu-limit

  profile-redis:
    image: redis:7.2
    command: ["redis-server", "--port", "11004", "--io-threads", "4"]
    restart: always
    networks:
      - hotel_network
    deploy: *cpu-limit

  profile-service:
    image: hotel_profile:${HOTEL_IMAGE_TAG:-latest}
    scale: ${PROFILE_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - profile-mongo
      - profile-redis
    environment: *service-environment
    volumes:
      - ${PROJECT_CONFIG_PATH}:/usr/config.json:ro
      - ${POLICY_PARAMS_PATH}:/usr/policy_params.json:ro
    deploy: *cpu-limit

  reservation-mongo:
    image: mongo:7.0
    command: --port 27005
    restart: always
    networks:
      - hotel_network
    volumes:
      - reservation:/data
    deploy: *cpu-limit

  reservation-redis:
    image: redis:7.2
    command: ["redis-server", "--port", "11005", "--io-threads", "4"]
    restart: always
    networks:
      - hotel_network
    deploy: *cpu-limit

  reservation-service:
    image: hotel_reservation:${HOTEL_IMAGE_TAG:-latest}
    scale: ${RESERVATION_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - reservation-mongo
      - reservation-redis
    environment: *service-environment
    volumes:
      - ${PROJECT_CONFIG_PATH}:/usr/config.json:ro
      - ${POLICY_PARAMS_PATH}:/usr/policy_params.json:ro
    deploy: *cpu-limit

  user-mongo:
    image: mongo:7.0
    command: --port 27006
    restart: always
    networks:
      - hotel_network
    volumes:
      - user:/data
    deploy: *cpu-limit

  user-service:
    image: hotel_user:${HOTEL_IMAGE_TAG:-latest}
    scale: ${USER_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - user-mongo
    environment: *service-environment
    volumes:
      - ${PROJECT_CONFIG_PATH}:/usr/config.json:ro
      - ${POLICY_PARAMS_PATH}:/usr/policy_params.json:ro
    deploy: *cpu-limit

  geo-service:
    image: hotel_geo:${HOTEL_IMAGE_TAG:-latest}
    scale: ${GEO_REPLICAS}
    restart: always
    networks:
      - hotel_network
    environment: *service-environment
    volumes:
      - ${PROJECT_CONFIG_PATH}:/usr/config.json:ro
      - ${POLICY_PARAMS_PATH}:/usr/policy_params.json:ro
    deploy: *cpu-limit

  search-service:
    image: hotel_search:${HOTEL_IMAGE_TAG:-latest}
    scale: ${SEARCH_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - geo-service
      - rate-service
    environment: *service-environment
    volumes:
      - ${PROJECT_CONFIG_PATH}:/usr/config.json:ro
      - ${POLICY_PARAMS_PATH}:/usr/policy_params.json:ro
    deploy: *cpu-limit

  hotel-frontend-service:
    image: hotel_frontend:${HOTEL_IMAGE_TAG:-latest}
    scale: ${FRONTEND_REPLICAS}
    restart: always
    networks:
      hotel_network:
        aliases:
          - hotel_frontend
    depends_on:
      - user-service
      - reservation-service
      - profile-service
      - rate-service
      - geo-service
      - search-service
    environment: *service-environment
    volumes:
      - ${PROJECT_CONFIG_PATH}:/usr/config.json:ro
      - ${POLICY_PARAMS_PATH}:/usr/policy_params.json:ro
    deploy: *cpu-limit
volumes:
  rate:
  profile:
  reservation:
  user:

networks:
  hotel_network:
    driver: bridge
