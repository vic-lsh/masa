services:
    rate-mongo:
        image: mongo:7.0
        container_name: "${PROJECT_PREFIX:-}rate_mongo"
        command: --port 27003
        restart: always
        networks:
            hotel_network:
                aliases:
                    - ${PROJECT_PREFIX:-}rate_mongo
        volumes:
            - rate:/data
        deploy:
            resources:
                limits:
                    cpus: "4"

    rate-redis:
        image: redis:7.2
        container_name: "${PROJECT_PREFIX:-}rate_redis"
        command: ["redis-server", "--port", "11003", "--io-threads", "4"]
        restart: always
        networks:
            hotel_network:
                aliases:
                    - ${PROJECT_PREFIX:-}rate_redis
        deploy:
            resources:
                limits:
                    cpus: "4"

    rate-service:
        image: hotel_rate:${HOTEL_IMAGE_TAG:-latest}
        scale: ${RATE_REPLICAS}
        restart: always
        networks:
            hotel_network:
                aliases:
                    - ${PROJECT_PREFIX:-}rate-service
        depends_on:
            - rate-mongo
            - rate-redis
        environment:
            - LOG_LEVEL=${LOG_LEVEL:-info}
        deploy:
            resources:
                limits:
                    cpus: "4"

    profile-mongo:
        image: mongo:7.0
        container_name: "${PROJECT_PREFIX:-}profile_mongo"
        command: --port 27004
        restart: always
        networks:
            hotel_network:
                aliases:
                    - ${PROJECT_PREFIX:-}profile_mongo
        volumes:
            - profile:/data
        deploy:
            resources:
                limits:
                    cpus: "4"

    profile-redis:
        image: redis:7.2
        container_name: "${PROJECT_PREFIX:-}profile_redis"
        command: ["redis-server", "--port", "11004", "--io-threads", "4"]
        restart: always
        networks:
            hotel_network:
