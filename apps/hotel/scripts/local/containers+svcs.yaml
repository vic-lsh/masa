services:
  rate-mongo:
    image: mongo:7.0
    container_name: "rate_mongo"
    command: --port 27003
    restart: always
    networks:
      - hotel_network
    volumes:
      - rate:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  rate-redis:
    image: redis:7.2
    container_name: "rate_redis"
    command: ["redis-server", "--port", "11003", "--io-threads", "4"]
    restart: always
    networks:
      - hotel_network
    deploy:
      resources:
        limits:
          cpus: "4"

  rate-service:
    image: hotel_rate:latest
    scale: ${RATE_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - rate-mongo
      - rate-redis
    deploy:
      resources:
        limits:
          cpus: "4"

  profile-mongo:
    image: mongo:7.0
    container_name: "profile_mongo"
    command: --port 27004
    restart: always
    networks:
      - hotel_network
    volumes:
      - profile:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  profile-redis:
    image: redis:7.2
    container_name: "profile_redis"
    command: ["redis-server", "--port", "11004", "--io-threads", "4"]
    restart: always
    networks:
      - hotel_network
    deploy:
      resources:
        limits:
          cpus: "4"

  profile-service:
    image: hotel_profile:latest
    scale: ${PROFILE_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - profile-mongo
      - profile-redis
    deploy:
      resources:
        limits:
          cpus: "4"

  reservation-mongo:
    image: mongo:7.0
    container_name: "reservation_mongo"
    command: --port 27005
    restart: always
    networks:
      - hotel_network
    volumes:
      - reservation:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  reservation-redis:
    image: redis:7.2
    container_name: "reservation_redis"
    command: ["redis-server", "--port", "11005", "--io-threads", "4"]
    restart: always
    networks:
      - hotel_network
    deploy:
      resources:
        limits:
          cpus: "4"

  reservation-service:
    image: hotel_reservation:latest
    scale: ${RESERVATION_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - reservation-mongo
      - reservation-redis
    deploy:
      resources:
        limits:
          cpus: "4"

  user-mongo:
    image: mongo:7.0
    container_name: "user_mongo"
    command: --port 27006
    restart: always
    networks:
      - hotel_network
    volumes:
      - user:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  user-service:
    image: hotel_user:latest
    scale: ${USER_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - user-mongo
    deploy:
      resources:
        limits:
          cpus: "4"

  geo-service:
    image: hotel_geo:latest
    scale: ${GEO_REPLICAS}
    restart: always
    networks:
      - hotel_network
    deploy:
      resources:
        limits:
          cpus: "4"

  search-service:
    image: hotel_search:latest
    scale: ${SEARCH_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - geo-service
      - rate-service
    deploy:
      resources:
        limits:
          cpus: "4"

  hotel-frontend-service:
    image: hotel_frontend:latest
    container_name: "hotel_frontend"
    restart: always
    networks:
      - hotel_network
    depends_on:
      - user-service
      - reservation-service
      - profile-service
      - rate-service
      - geo-service
      - search-service
    deploy:
      resources:
        limits:
          cpus: "4"
volumes:
  rate:
  profile:
  reservation:
  user:

networks:
  hotel_network:
    driver: bridge
