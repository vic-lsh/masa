services:
  rate-mongo:
    image: mongo:7.0
    container_name: "rate_mongo"
    command: --port 27003
    restart: always
    networks:
      - hotel_network
    volumes:
      - rate:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  rate-memcached:
    image: memcached:1.6
    container_name: "rate_memcached"
    command: --port 11003 --threads 4
    restart: always
    networks:
      - hotel_network
    deploy:
      resources:
        limits:
          cpus: "4"

  rate-service:
    image: hotel:latest
    scale: ${RATE_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - rate-mongo
      - rate-memcached
    environment:
      - BINARY_NAME=hotel_rate
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"

  profile-mongo:
    image: mongo:7.0
    container_name: "profile_mongo"
    command: --port 27004
    restart: always
    networks:
      - hotel_network
    volumes:
      - profile:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  profile-memcached:
    image: memcached:1.6
    container_name: "profile_memcached"
    command: --port 11004 --threads 4
    restart: always
    networks:
      - hotel_network
    deploy:
      resources:
        limits:
          cpus: "4"

  profile-service:
    image: hotel:latest
    scale: ${PROFILE_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - profile-mongo
      - profile-memcached
    environment:
      - BINARY_NAME=hotel_profile
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"

  reservation-mongo:
    image: mongo:7.0
    container_name: "reservation_mongo"
    command: --port 27005
    restart: always
    networks:
      - hotel_network
    volumes:
      - reservation:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  reservation-memcached:
    image: memcached:1.6
    container_name: "reservation_memcached"
    command: --port 11005 --threads 4
    restart: always
    networks:
      - hotel_network
    deploy:
      resources:
        limits:
          cpus: "4"

  reservation-service:
    image: hotel:latest
    scale: ${RESERVATION_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - reservation-mongo
      - reservation-memcached
    environment:
      - BINARY_NAME=hotel_reservation
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"

  user-mongo:
    image: mongo:7.0
    container_name: "user_mongo"
    command: --port 27006
    restart: always
    networks:
      - hotel_network
    volumes:
      - user:/data
    deploy:
      resources:
        limits:
          cpus: "4"

  user-service:
    image: hotel:latest
    scale: ${USER_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - user-mongo
    environment:
      - BINARY_NAME=hotel_user
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"

  geo-service:
    image: hotel:latest
    scale: ${GEO_REPLICAS}
    restart: always
    networks:
      - hotel_network
    environment:
      - BINARY_NAME=hotel_geo
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"

  search-service:
    image: hotel:latest
    scale: ${SEARCH_REPLICAS}
    restart: always
    networks:
      - hotel_network
    depends_on:
      - geo-service
      - rate-service
    environment:
      - BINARY_NAME=hotel_search
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"

  hotel-frontend-service:
    image: hotel:latest
    container_name: "hotel_frontend"
    restart: always
    networks:
      - hotel_network
    depends_on:
      - user-service
      - reservation-service
      - profile-service
      - rate-service
      - geo-service
      - search-service
    environment:
      - BINARY_NAME=hotel_frontend
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    deploy:
      resources:
        limits:
          cpus: "4"
volumes:
  rate:
  profile:
  reservation:
  user:

networks:
  hotel_network:
    driver: bridge
