{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hotel.serviceAccountName" . }}
  labels:
    {{- include "hotel.labels" (dict "context" . "component" "service-account") | nindent 4 }}
{{- end }}

{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hotel.componentName" (dict "context" . "name" "endpointslice-reader") }}
  labels:
    {{- include "hotel.labels" (dict "context" . "component" "rbac") | nindent 4 }}
rules:
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hotel.componentName" (dict "context" . "name" "endpointslice-reader") }}
  labels:
    {{- include "hotel.labels" (dict "context" . "component" "rbac") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hotel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hotel.componentName" (dict "context" . "name" "endpointslice-reader") }}
{{- end }}
