apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: reservation-mongo
  name: reservation-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: reservation-mongo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: reservation-mongo
    spec:
      containers:
        - args:
            - --port
            - "27005"
          image: mongo:7.0
          name: reservation-mongo
          ports:
            - containerPort: 27005
              protocol: TCP
          resources:
            limits:
              cpu: "4"
          volumeMounts:
            - mountPath: /data
              name: reservation
      restartPolicy: Always
      volumes:
        - name: reservation
          persistentVolumeClaim:
            claimName: reservation
