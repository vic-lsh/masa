[package]
name = "masa-benchmark"
version = "0.1.0"
edition = "2021"

[features]
trace-queue = ["masa/trace-queue", "tonic/trace-queue"]

[dependencies]
masa = { path = "../../libs/masa" }
tonic = { path = "../../libs/tonic/tonic" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hdrhistogram = "7.5"
prost = "0.12"
bincode = "1.3"
base64 = "0.21"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "e2e"
harness = false

[build-dependencies]
tonic-build = { path = "../../libs/tonic/tonic-build", features = ["prost"] }
