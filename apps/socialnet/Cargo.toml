[package]
name = "socialnet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "textservice_server"
path = "src/text_service/main.rs"

[[bin]]
name = "textservice_client"
path = "src/text_service/client.rs"

[[bin]]
name = "textservice_bench"
path = "src/text_service/client_gen.rs"

[[bin]]
name = "usermention_server"
path = "src/user_mention/main.rs"

[[bin]]
name = "usermention_client"
path = "src/user_mention/client.rs"

[[bin]]
name = "url_shorten_server"
path = "src/url_shorten/main.rs"

[[bin]]
name = "url_shorten_client"
path = "src/url_shorten/client.rs"


[features]
prio_class = ["async-executor/prio_class", "tonic-masa/prio_class", "tonic/prio_class"]
prio_global = ["async-executor/prio_global", "tonic-masa/prio_global", "tonic/prio_global"]
prio_global_early = [
	"async-executor/prio_global_early",
	"tonic-masa/prio_global_early",
	"tonic/prio_global_early",
]
prio_class_global = [
	"async-executor/prio_class_global",
	"tonic-masa/prio_class_global",
	"tonic/prio_class_global",
]
prio_local = ["async-executor/prio_local", "tonic-masa/prio_local", "tonic/prio_local"]
prio_local_early = [
	"async-executor/prio_local_early",
	"tonic-masa/prio_local_early",
	"tonic/prio_local_early",
]
fifo = ["async-executor/fifo", "tonic-masa/fifo", "tonic/fifo"]
fifo_early = ["async-executor/fifo_early", "tonic-masa/fifo_early", "tonic/fifo_early"]
fifo_infra = ["async-executor/fifo_infra", "tonic-masa/fifo_infra", "tonic/fifo_infra"]

[dependencies]
tonic = { path = "../../libs/tonic/tonic" }
prost = "0.12"
tokio = { path = "../../libs/tokio/tokio", features = ["full"] }
mongodb = { path = "../../3rd_party/mongodb" }
memcache = "0.16"
async-memcached = { path = "../../3rd_party/async-memcached" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
futures-lite = { version = "2.0.0" }
futures = "0.3"
rand = "0.8.5"  
log = "0.4"
env_logger = "0.10"
opentelemetry = { version = "0.20", features = ["trace"] }
tracing-opentelemetry = "0.20"
tracing = "0.1"
regex = "1.11.1"
chrono = "0.4.23"
csv = "1.3"
async-executor = { path = "../../libs/async-executor" }
tonic-masa = { path = "../../libs/tonic/tonic-masa" }
async-task = { path = "../../libs/async-task" }


[build-dependencies]
tonic-build = { path = "../../libs/tonic/tonic-build", features = ["prost"] }
