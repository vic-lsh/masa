[package]
name = "socialnet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "textservice_server"
path = "src/text_service/main.rs"

[[bin]]
name = "textservice_client"
path = "src/text_service/client.rs"

[[bin]]
name = "textservice_bench"
path = "src/text_service/client_gen.rs"

[[bin]]
name = "usermention_server"
path = "src/user_mention/main.rs"

[[bin]]
name = "usermention_client"
path = "src/user_mention/client.rs"

[[bin]]
name = "url_shorten_server"
path = "src/url_shorten/main.rs"

[[bin]]
name = "url_shorten_client"
path = "src/url_shorten/client.rs"

[[bin]]
name = "user_service"
path = "src/user/main.rs"

[[bin]]
name = "user_timeline_server"
path = "src/user_timeline/main.rs"

[[bin]]
name = "post_storage_server"
path = "src/post_storage/main.rs"

[[bin]]
name = "compose_post_server"
path = "src/compose_post/main.rs"

[[bin]]
name = "home_timeline_server"
path = "src/home_timeline/main.rs"

[[bin]]
name = "social_graph_server"
path = "src/social_graph/main.rs"

[[bin]]
name = "write_home_timeline_server"
path = "src/write_home_timeline/main.rs"


[features]
prio_class = [
  "tokio/prio_class",
  "masa/prio_class",
  "tonic/prio_class",
]
prio_global = [
  "tokio/prio_global",
  "masa/prio_global",
  "tonic/prio_global",
]
prio_global_early = [
  "tokio/prio_global_early",
  "masa/prio_global_early",
  "tonic/prio_global_early",
]
prio_class_global = [
  "tokio/prio_class_global",
  "masa/prio_class_global",
  "tonic/prio_class_global",
]
prio_local = [
  "tokio/prio_local",
  "masa/prio_local",
  "tonic/prio_local",
]
prio_local_early = [
  "tokio/prio_local_early",
  "masa/prio_local_early",
  "tonic/prio_local_early",
]
prio_local_direct = [
  "tokio/prio_local_direct",
  "masa/prio_local_direct",
  "tonic/prio_local_direct",
]
prio_local_indirect = [
  "tokio/prio_local_indirect",
  "masa/prio_local_indirect",
  "tonic/prio_local_indirect",
]
perfect_lsf = [
  "tokio/perfect_lsf",
  "masa/perfect_lsf",
  "tonic/perfect_lsf",
]
fifo = ["tokio/fifo", "masa/fifo", "tonic/fifo"]
fifo_early = [
  "tokio/fifo_early",
  "masa/fifo_early",
  "tonic/fifo_early",
]
fifo_infra = [
  "tokio/fifo_infra",
  "masa/fifo_infra",
  "tonic/fifo_infra",
]

[dependencies]
tonic = { path = "../../libs/tonic/tonic" }
prost = "0.12"
tokio = { path = "../../libs/tokio/tokio", features = ["full"] }
mongodb = { version = "=2.8.2" }
memcache = "0.16"
async-memcached = { path = "../../3rd_party/async-memcached" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
futures-lite = { version = "2.0.0" }
futures = "0.3"
rand = "0.8.5"
log = "0.4"
env_logger = "0.10"
opentelemetry = { version = "0.20", features = ["trace"] }
tracing-opentelemetry = "0.20"
tracing = "0.1"
regex = "1.11.1"
chrono = "0.4.23"
csv = "1.3"
masa = { path = "../../libs/masa" }
jsonwebtoken = "9.3.1"
hex = "0.4.3"
redis-async = "0.18.0"
redis = { version = "0.32", features = ["aio", "tokio-comp", "cluster-async"] }
sha2 = "0.10.9"
once_cell = "1.20"
clap = { version = "4.5.48", features = ["derive", "env"] }
bb8-redis = "0.24.0"
bb8 = "0.9.0"
anyhow = "1.0.100"
lapin = "2.3.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
config = { version = "0.14.0", features = ["json"] }
hotel = { path = "../hotel" }
rand_distr = "0.4"

[build-dependencies]
tonic-build = { path = "../../libs/tonic/tonic-build", features = ["prost"] }
