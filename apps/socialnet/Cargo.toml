[package]
name = "socialnet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "textservice_server"
path = "src/text_service/main.rs"

[[bin]]
name = "textservice_client"
path = "src/text_service/client.rs"

[[bin]]
name = "textservice_bench"
path = "src/text_service/client_gen.rs"

[[bin]]
name = "usermention_server"
path = "src/user_mention/main.rs"

[[bin]]
name = "usermention_client"
path = "src/user_mention/client.rs"

[[bin]]
name = "url_shorten_server"
path = "src/url_shorten/main.rs"

[[bin]]
name = "url_shorten_client"
path = "src/url_shorten/client.rs"

[[bin]]
name = "user_service"
path = "src/user/main.rs"

[[bin]]
name = "user_timeline_server"
path = "src/user_timeline/main.rs"

[[bin]]
name = "post_storage_server"
path = "src/post_storage/main.rs"

[[bin]]
name = "compose_post_server"
path = "src/compose_post/main.rs"

[[bin]]
name = "home_timeline_server"
path = "src/home_timeline/main.rs"

[[bin]]
name = "social_graph_server"
path = "src/social_graph/main.rs"

[[bin]]
name = "write_home_timeline_server"
path = "src/write_home_timeline/main.rs"

[[bin]]
name = "media_service"
path = "src/media/main.rs"

[[bin]]
name = "unique_id_service"
path = "src/unique_id/server.rs"

[[bin]]
name = "socialnet_client_bench"
path = "src/client/client_bench.rs"

# If you ever needed for command-line test clients, could add these:
# [[bin]]
# name = "media_client"
# path = "src/media/client.rs"
# 
# [[bin]]
# name = "unique_id_client"
# path = "src/unique_id/client.rs"

[features]
prio_global = [
  "tokio/prio_global",
  "masa/prio_global",
  "tonic/prio_global",
]
prio_local = [
  "tokio/prio_local",
  "masa/prio_local",
  "tonic/prio_local",
]
fifo = ["tokio/fifo", "masa/fifo", "tonic/fifo"]

early = [
    "masa/early",
    "tonic/early",
]

[dependencies]
tonic = { path = "../../libs/tonic/tonic" }
prost = "0.12"
tokio = { path = "../../libs/tokio/tokio", features = ["full", "macros", "rt-multi-thread"] }
mongodb = { version = "=2.8.2" }
async-memcached = { path = "../../3rd_party/async-memcached" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
futures-lite = { version = "2.0.0" }
futures = "0.3"
rand = "0.8.5"
log = "0.4"
env_logger = "0.10"
opentelemetry = { version = "0.20", features = ["trace"] }
tracing-opentelemetry = "0.20"
tracing = "0.1"
regex = "1.11.1"
chrono = "0.4.23"
csv = "1.3"
masa = { path = "../../libs/masa" }
jsonwebtoken = "9.3.1"
hex = "0.4.3"
deadpool-redis = { version = "0.14.0", features = ["rt_tokio_1", "cluster"] }
sha2 = "0.10.9"
once_cell = "1.20"
clap = { version = "4.5.48", features = ["derive", "env"] }
bb8-redis = "0.24.0"
bb8 = "0.9.0"
anyhow = "1.0.100"
lapin = "2.3.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.14.0", features = ["json"] }
url = "2.5"
rand_distr = "0.4"
app-utils = { path = "../app-utils" }
structopt = "0.3.23"

[build-dependencies]
tonic-build = { path = "../../libs/tonic/tonic-build", features = ["prost"] }
protoc-bin-vendored = "3"

# trying to fix depdnedncies
[patch.crates-io]
tokio = { path = "../../libs/tokio/tokio" }
tokio-macros = { path = "../../libs/tokio/tokio-macros" }
tokio-util = { path = "../../libs/tokio/tokio-util" }
hyper = { path = "../../libs/hyper" }
tower-service = { path = "../../libs/tower/tower-service" }


