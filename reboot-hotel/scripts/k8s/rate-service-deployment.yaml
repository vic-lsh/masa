apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f containers+svcs.yaml
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: rate-service
  name: rate-service
spec:
  replicas: 6
  selector:
    matchLabels:
      io.kompose.service: rate-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f containers+svcs.yaml
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: rate-service
    spec:
      containers:
        - image: vicsli/hotel_rate:latest
          name: hotel-rate
          # imagePullPolicy: Never
          ports:
            - containerPort: 8660
              protocol: TCP
          resources:
            limits:
              cpu: "1"
      restartPolicy: Always
