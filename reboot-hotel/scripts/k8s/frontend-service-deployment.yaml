apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f containers+svcs.yaml
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: frontend-service
  name: frontend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: frontend-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f containers+svcs.yaml
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: frontend-service
    spec:
      containers:
        - image: hotel_frontend:latest
          name: hotel-frontend
          ports:
            - containerPort: 8660
              protocol: TCP
          resources:
            limits:
              cpu: "4"
      restartPolicy: Always
