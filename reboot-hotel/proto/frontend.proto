syntax = "proto3";

package frontend;

service Frontend {
  rpc HandleSearch(SearchRequest) returns (SearchResponse) {}
}

message SearchRequest {
  float lat = 1;
  float lon = 2;
  string inDate = 3;
  string outDate = 4;
}

message SearchResponse { repeated Hotel hotels = 1; }

message Hotel {
  string name = 1;

  // string phoneNumber = 2;
  // string description = 3;
  // Address address = 4;
  // repeated Image images = 5;
}

