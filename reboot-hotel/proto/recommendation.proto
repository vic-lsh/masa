syntax = "proto3";
package recommendation;

service Recommendation {
    rpc GetRecommendations (RecommendationRequest) returns (RecommendationReply);
}

message RecommendationRequest {
  string require = 1;
  double lat = 2;
  double lon = 3;
}

message RecommendationReply {
  repeated string HotelIds = 1;
}
