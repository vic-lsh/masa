[package]
name = "async-executor"
# When publishing a new version:
# - Update CHANGELOG.md
# - Create "v1.x.y" git tag
version = "1.11.0"
authors = [
	"Stjepan Glavina <stjepang@gmail.com>",
	"John Nunley <dev@notgull.net>",
]
edition = "2021"
rust-version = "1.63"
description = "Async executor"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smol-rs/async-executor"
keywords = ["asynchronous", "executor", "single", "multi", "spawn"]
categories = ["asynchronous", "concurrency"]
exclude = ["/.*"]

[features]
# Adds support for executors optimized for use in static variables.
static = []
prio_class = []
prio_global = []
prio_global_early = []
prio_class_global = []
prio_local = []
prio_local_early = []
fifo_infra = []
fifo = []

[dependencies]
async-task = { path = "../async-task" }
concurrent-queue = "2.5.0"
fastrand = "2.0.0"
futures-lite = { version = "2.0.0", default-features = true }
slab = "0.4.4"
tonic-masa = { path = "../../tonic-masa" }
log = "0.4"
# needed so that our static executor can run on tokio, to remain compatible
# with hyper servers.
tokio = { path = "../tokio/tokio" }

[target.'cfg(target_family = "wasm")'.dependencies]
futures-lite = { version = "2.0.0", default-features = false, features = [
	"std",
] }

[dev-dependencies]
async-channel = "2.0.0"
async-io = "2.1.0"
async-lock = "3.0.0"
criterion = { version = "0.5", default-features = false, features = [
	"cargo_bench_support",
] }
easy-parallel = "3.1.0"
fastrand = "2.0.0"
futures-lite = "2.0.0"
once_cell = "1.16.0"

[[bench]]
name = "executor"
harness = false
required-features = ["static"]
