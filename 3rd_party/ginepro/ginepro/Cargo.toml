[package]
name = "ginepro"
version = "0.8.1"
edition = "2021"
description = "A client-side gRPC channel implementation for tonic"
repository = "https://github.com/TrueLayer/ginepro"
license = "MIT OR Apache-2.0"
keywords = ["gRPC", "tonic", "channel", "load", "balancer"]
categories = ["asynchronous", "web-programming"]
readme = "../README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
http = "1"
thiserror = "1"
tokio = { path = "../../tokio/tokio", features = ["full"] }
tonic = { path = "../../../libs/tonic/tonic", features = ["tls"] }
tower = { path = "../../tower/tower", default-features = false, features = ["discover"] }
tracing = "0.1"
trust-dns-resolver = { path = "../../trust-dns/crates/resolver" }

[dev-dependencies]
proptest = "1"
shared-proto = { path = "../shared_proto" }
tests = { path = "../tests" }

[patch.crates-io]
tokio = { path = "../../tokio/tokio", version = "1" }
