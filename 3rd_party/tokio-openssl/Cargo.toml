[package]
name = "tokio-openssl"
version = "0.6.4"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
license = "MIT/Apache-2.0"
edition = "2018"
repository = "https://github.com/tokio-rs/tokio-openssl"
description = """
An implementation of SSL streams for Tokio backed by OpenSSL
"""

[dependencies]
futures-util = { version = "0.3", default-features = false }
openssl = "0.10.61"
openssl-sys = "0.9"
tokio = { path = "../../libs/tokio/tokio" }

[dev-dependencies]
tokio = { path = "../../libs/tokio/tokio", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ossl111)'] }
