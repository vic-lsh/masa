[package]
name = "uniqueIdService"
version = "0.1.0"
edition = "2021"

[[bin]] # Bin to run the uniqueIdService gRPC server
name = "uniqueIdService-server"
path = "src/server.rs"

[[bin]] # Bin to run the uniqueIdService gRPC client
name = "uniqueIdService-client"
path = "src/client.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
rand = "0.8.5"  
log = "0.4"
env_logger = "0.10"

[build-dependencies]
tonic-build = "0.12"
